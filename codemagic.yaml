workflows:
  ios-testflight:
    name: LP Watcher — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tonygallippi.lpwatcher
      vars:
        BUNDLE_ID: com.tonygallippi.lpwatcher
        APP_VERSION: "1.0.0"
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-preview
          include: true
          source: true
    scripts:
      - name: Install Capacitor dependencies
        script: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
      - name: Test and build web assets
        script: |
          npm test
          npm run build
      - name: Generate native iOS project
        script: |
          npx cap add ios
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" ios/App/App/Info.plist || true
      - name: Configure signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups: []
